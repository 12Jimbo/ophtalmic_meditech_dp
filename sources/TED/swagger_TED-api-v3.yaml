---
openapi: 3.1.0
info:
  version: 3.0.0
  description: |
    <h1>Introduction</h1>
    <p>
        Public API documentation aims to describe the Public API endpoints.
    </p>
  title: Public API Documentation
paths:
  /v3/notices/submit:
    post:
      tags:
      - Publication
      summary: Submit XML notice
      description: |
        <ul>
             <li>Creates a notice instance after validating the request.
             <li>A notice with a valid and unique businessId that passes validation, receives status SUBMITTED and can be published.
             <li>If validation fails, the notice receives a VALIDATION_FAILED status and the notice cannot be published.
             <li>No instance is created if the notice cannot be parsed or if the businessId is not unique.
         </ul>
      operationId: submitNotice
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/NoticeSubmitRequest"
        required: true
      responses:
        "201":
          description: |
            Notice created and validation report URL provided.
            If "success": true, the notice was validated without errors and is ready for publication.
            If "success": false, publication is blocked due to validation errors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticeSubmitResponse"
        "400":
          description: |
            Possible issues:
            - Missing Authorization header in request.
            - Missing notice.
            - Missing metadata.
            - Missing noticeAuthorEmail.
            - Missing noticeAuthorLang.
            - Notice with the same noticeId and versionId already exists.
            - noticeAuthorEmail is not valid.
            - Notice parameter cannot be empty.
            - Notice cannot be parsed; is not valid against the schema.
            - Could not find or register the given procedure ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBody"
        "401":
          description: The provided API key doesn't exist or it is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBody"
        "403":
          description: eNotices2 account not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBody"
        "404":
          description: |
            Possible issues:
            - No compatible SDK version found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBody"
        "409":
          description: |
            Possible issues:
            - Multiple objects are created/updated at the same time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBody"
        "500":
          description: |
            Possible issues:
            - The provided API key cannot be currently validated.
            - The CVS is not available to validate the notice.
            - The CVS could not execute the validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBody"
  /v3/notices/validate:
    post:
      tags:
      - Validation
      summary: Validate a notice
      description: |
        - Performs schematron validation on a provided notice and returns a detailed report.The notice content must be submitted as a base64 string.
        - Optional parameters allow for specifying the language for error messages, the validation mode, and the eForms SDK version to validate against, with defaults for unspecified values.
      operationId: validate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoticeValidationRequest"
        required: true
      responses:
        "200":
          description: The report is returned.
          content:
            application/xml:
              schema:
                type: object
                xml:
                  name: schematron-output
              example: |
                <svrl:schematron-output xmlns:svrl="http://purl.oclc.org/dsdl/svrl" title="eForms schematron rules" phase="1">
                    <svrl:ns-prefix-in-attribute-values prefix="xs" uri="http://www.w3.org/2001/XMLSchema" />
                    <svrl:ns-prefix-in-attribute-values prefix="sch" uri="http://purl.oclc.org/dsdl/schematron" />
                    <svrl:ns-prefix-in-attribute-values prefix="cbc" uri="urn:oasis:names:specification:ubl:schema:xsd:CommonBasicComponents-2" />
                    <svrl:active-pattern id="EFORMS-validation-stage-1a" />
                    <svrl:fired-rule context="/*" />
                    <svrl:fired-rule context="//cbc:ActivityTypeCode" />
                    <svrl:fired-rule context="//cbc:CountrySubentityCode" />
                    <svrl:active-pattern id="EFORMS-validation-stage-4-1" />
                    <svrl:fired-rule context="/*/cac:ProcurementProject[$noticeSubType = '1']" />
                    <svrl:fired-rule context="/*/cac:ProcurementProject/cac:RealizedLocation[$noticeSubType = '1']" />
                    <svrl:active-pattern id="EFORMS-validation-stage-5" />
                    <svrl:fired-rule context="/*" />
                    <svrl:fired-rule context="/*/cac:ContractingParty" />
                    <svrl:fired-rule context="/*/cac:ContractingParty/cac:Party" />
                    <svrl:fired-rule context="/*/cac:ContractingParty/cac:Party/cac:PartyIdentification/cbc:ID" />
                </svrl:schematron-output>
        "400":
          description: |-
            Possible issues:
            - The 'language' parameter is not valid.
            - The 'validationMode' parameter is not valid. The 'validationMode' parameter is not valid.
            - The rules are missing for the following version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TedAppsErrorResponse"
              example:
                errorCode: 400
                message: The validation mode is an invalid mode. Please choose between
                  'static' or 'dynamic' mode.
                timestamp: 2025-12-23T09:33:59Z
        "401":
          description: |-
            Possible issues:
            - The provided API key doesn't exist or it is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TedAppsErrorResponse"
              example:
                errorCode: 401
                message: "Missing key in header: X-API-Key"
                timestamp: 2025-12-23T09:39:39Z
        "500":
          description: |-
            Possible issues:
            - The provided API key cannot be currently validated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TedAppsErrorResponse"
              example:
                errorCode: 500
                message: "Service is unavailable, key in header X-API-Key cannot be\
                  \ validated"
                timestamp: 2025-12-23T09:40:27Z
  /v3/config/sdk-versions:
    get:
      tags:
      - Developer Operations
      summary: Return version-range.json
      description: Returns content of the 'version-range.json' file as a JSON response
        body.
      operationId: sdk-range
      responses:
        "200":
          description: The information on accepted SDK versions is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SdkConfigDto"
              example:
                updatedOn: 2025-02-12T10:00:00
                activeVersionRange:
                  earliest:
                    before: "1.7"
                    after: "1.12"
                    switchDate: 2025-04-30T23:59:00+02:00
                  latest:
                    before: "1.12"
                    after: "1.14"
                    switchDate: 2025-03-06T03:00:00+02:00
                  excluded:
                    before:
                    - "0.1"
                    after:
                    - "0.1"
                    switchDate: 2020-01-01T10:00:00+02:00
        "401":
          description: |-
            Possible issues:
            - The provided API key doesn't exist or it is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TedAppsErrorResponse"
              example:
                errorCode: 401
                message: "Missing key in header: X-API-Key"
                timestamp: 2025-12-23T09:39:39Z
        "500":
          description: |-
            Possible issues:
            - The provided API key cannot be currently validated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TedAppsErrorResponse"
              example:
                errorCode: 500
                message: "Service is unavailable, key in header X-API-Key cannot be\
                  \ validated"
                timestamp: 2025-12-23T09:40:27Z
  /v3/notices/render:
    post:
      tags:
      - Visualisation
      summary: Get HTML or PDF rendering of a notice sent in the request body.
      description: |
        - Generates a PDF or HTML version of an eForms notice.
        - The notice content must be submitted as a base64-encoded string.
        - The rendering includes mandatory language specification for field labels and text, with fallback to the notice's original language if needed.
        - The rendering is based on the SDK version indicated within the notice content.
      operationId: renderNotice
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoticeRenderRequest"
        required: true
      responses:
        "400":
          description: |
            Possible issues:
            - 'file', 'format' or 'language' is missing.
            - The language is not valid.
            - Notice cannot be parsed (parsing errors).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TedAppsErrorResponse"
              example:
                errorCode: 400
                message: "Invalid 'format' parameter value. Possible values are: [PDF,\
                  \ HTML]."
                timestamp: 2023-01-01T00:00:00+01:00
        "200":
          description: OK
          content:
            text/html:
              example: |
                <!DOCTYPE html>
                <html lang="en">
                    <body>
                        <div class="content">
                            <div class="h2" id="section1">1 <span label-id="auxiliary|text|buyer">Buyer</span></div>
                        </div>
                    </body>
                </html>
            application/pdf:
              examples:
                PDF rendering of the notice:
                  description: PDF rendering of the notice
        "202":
          description: "This request is being processed, but could not be finished\
            \ before connection time out, please try again later."
          content:
            text/html:
              example: |
                <!DOCTYPE html>
                <html lang="en">
                    <head>
                        <meta charset="UTF-8">
                        <title>Request under processing</title>
                    </head>
                    <body>
                        <p>This request could not be completed before the connection timed out. It will continue to be processed in the background. Please try again later to retrieve the result.</p>
                    </body>
                </html>
            application/pdf:
              examples:
                Rendering under processing:
                  description: Message in PDF indicating that the notice rendering
                    is under processing
        "401":
          description: |
            Possible issues:
            - The provided API key doesn't exist or it is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TedAppsErrorResponse"
              example:
                errorCode: 401
                message: "Missing key in header: X-API-Key"
                timestamp: 2023-01-01T00:00:00+01:00
        "500":
          description: |
            Possible issues:
            - The provided API key cannot be currently validated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TedAppsErrorResponse"
              example:
                errorCode: 500
                message: "Service is unavailable, key in header X-API-Key cannot be\
                  \ validated"
                timestamp: 2023-01-01T00:00:00+01:00
        "504":
          description: |
            Possible issues:
            - Processing was interrupted and could not be completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TedAppsErrorResponse"
              example:
                errorCode: 504
                message: Notice in the request is too heavy and the request cannot
                  be completed within the allocated time
                timestamp: 2023-01-01T00:00:00+01:00
  /v3/notices/render-async:
    post:
      tags:
      - Visualisation
      summary: Get HTML or PDF rendering of a notice sent in the request body.
      description: Generates a PDF or HTML version of an eForms notice in an asynchronous
        process and sends back the generated rendering at the specified call-back
        URL.
      operationId: renderNoticeWithCallback
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoticeRenderAsyncRequest"
        required: true
      responses:
        "400":
          description: |
            Possible issues:
            - 'file', 'format' or 'language' is missing.
            - The language is not valid.
            - Notice cannot be parsed (parsing errors).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TedAppsErrorResponse"
              example:
                errorCode: 400
                message: "Invalid 'format' parameter value. Possible values are: [PDF,\
                  \ HTML]."
                timestamp: 2023-01-01T00:00:00+01:00
        "200":
          description: OK
          content:
            text/plain:
              example: "Your request is being processed asynchronously, and the result\
                \ will be returned to the following callback URL: \"https://example.test\""
        "401":
          description: |
            Possible issues:
            - The provided API key doesn't exist or it is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TedAppsErrorResponse"
              example:
                errorCode: 401
                message: "Missing key in header: X-API-Key"
                timestamp: 2023-01-01T00:00:00+01:00
        "500":
          description: |
            Possible issues:
            - The provided API key cannot be currently validated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TedAppsErrorResponse"
              example:
                errorCode: 500
                message: "Service is unavailable, key in header X-API-Key cannot be\
                  \ validated"
                timestamp: 2023-01-01T00:00:00+01:00
        "504":
          description: |
            Possible issues:
            - Processing was interrupted and could not be completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TedAppsErrorResponse"
              example:
                errorCode: 504
                message: Notice in the request is too heavy and the request cannot
                  be completed within the allocated time
                timestamp: 2023-01-01T00:00:00+01:00
  /v3/notices/convert:
    post:
      tags:
      - Conversion
      summary: Convert an XML notice
      description: Converts an XML notice from the old TED XML format to a partial
        eForms notice.
      operationId: convertNotice
      requestBody:
        content:
          application/xml:
            schema:
              type: array
              items:
                type: string
                format: byte
        required: true
      responses:
        "200":
          description: The notice was successfully converted.
          content:
            application/xml:
              schema:
                type: array
                items:
                  type: string
                  format: byte
        "400":
          description: |
            Possible issues:
            - Missing Authorization header in request.
            - The request body is incomplete or invalid.
        "401":
          description: The provided API key doesn't exist or it is invalid.
        "422":
          description: Conversion for the given notice type is currently not supported.
        "500":
          description: |
            Possible issues:
            - The provided API key cannot be currently validated.
  /v3/api-keys/{token}/renew:
    post:
      tags:
      - Developer Operations
      summary: Renew the user API Key
      description: "Extends the validity of an active API Key. If the API Key is already\
        \ inactive, a new one must be created. This endpoint is designed to be accessed\
        \ indirectly, through the link provided in the email notification sent as\
        \ the key approaches its expiration date."
      operationId: renewApiKey
      parameters:
      - name: token
        in: path
        description: The token received in the notification email.
        required: true
        schema:
          type: string
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      responses:
        "200":
          description: The API Key validity has been extended.
        "400":
          description: |
            Possible issues:
            - The token provided is invalid.
            - The token provided is not active anymore.
        "401":
          description: |
            Possible issues:
            - The API Key has expired or has been revoked.
  /v3/notices/{businessId}/stop-publication:
    post:
      tags:
      - Publication
      summary: Stop the notice publication
      description: |
        <ul>
        <li>Stops the ongoing publication process for a notice identified by a given businessId.
        <li>If the notice's status is SUBMITTED, its status is changed to STOPPED and it's withdrawn from publication.
        <li>If the notice's status is not SUBMITTED, there is no effect.
        </ul>
      operationId: stopPublication
      parameters:
      - name: businessId
        in: path
        description: The notice business identifier (notice identifier - version).
        required: true
        schema:
          type: string
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6-01
      responses:
        "200":
          description: The publication of the notice has been stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notice"
        "400":
          description: |
            Possible issues:
            - Missing Authorization header in request.
            - Invalid business id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBody"
        "401":
          description: The provided API key doesn't exist or it is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBody"
        "403":
          description: |
            Possible issues:
            - Notice publication cannot be stopped, because it is not in SUBMITTED status.
            - eNotices2 account not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBody"
        "404":
          description: Notice was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBody"
        "423":
          description: Cannot acquire lock because notice is already locked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBody"
        "500":
          description: |
            Possible issues:
            - The provided API key cannot be currently validated.
            - Internal error while updating notice status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBody"
  /v3/notices/{businessId}/validation-report:
    get:
      tags:
      - Publication
      summary: Retrieve the notice validation report
      description: |
        <ul>
            Retrieves the validation report generated during the submission process of a notice; the notice must be identified by its businessId.
        </ul>
      operationId: getValidationReport
      parameters:
      - name: businessId
        in: path
        description: The notice business identifier (notice identifier - version).
        required: true
        schema:
          type: string
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6-01
      responses:
        "200":
          description: |
            Provides the notice validation report in SVRL (Schematron Validation Report Language) format.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        "400":
          description: |
            Possible issues:
            - Missing Authorization header in request.
            - Invalid business id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBody"
        "401":
          description: The provided API key doesn't exist or it is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBody"
        "403":
          description: eNotices2 account not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBody"
        "404":
          description: Notice or notice report was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBody"
        "500":
          description: |
            Possible issues:
            - The provided API key cannot be currently validated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBody"
  /v3/notices:
    get:
      tags:
      - Publication
      summary: Search your submitted notices
      description: |
        <ul>
            Provides a paginated list of a user's submitted notices and their associated data, based on applied search and sorting criteria. Access is restricted to notices submitted by the requesting user.
        </ul>
      operationId: getNotices
      parameters:
      - name: page
        in: query
        description: Indicates the page number of the paginated result list.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        description: Indicates the size of the paginated result list.
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          minimum: 1
      - name: sortProperty
        in: query
        description: The property to use to sort the results.
        required: false
        schema:
          type: string
          enum:
          - id
          - versionId
          - procedureId
          - status
          - createdAt
          - updatedAt
          - submittedAt
          - transmittedAt
          - publicationId
          - publicationDate
          - noticeType
          - legalBasis
          - noticeAuthor
          - expectedPublicationDate
      - name: sortDirection
        in: query
        description: "The sort direction, ascending (ASC) or descending (DESC)."
        required: false
        schema:
          type: string
          enum:
          - ASC
          - DESC
      - name: searchNotices
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/NoticeSearchRequest"
      responses:
        "200":
          description: All notices based on filters. Even if 0 results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticeSearchResponse"
        "400":
          description: Missing Authorization header in request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBody"
        "401":
          description: The provided API key doesn't exist or it is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBody"
        "403":
          description: eNotices2 account not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBody"
        "500":
          description: |
            Possible issues:
            - The provided API key cannot be currently validated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionBody"
  /v3/notices/search:
    post:
      tags:
      - Search
      summary: Search for notices using expert search query
      description: |
        <details>
          <summary><strong>Documentation</strong></summary>
          <h1>Introduction</h1>

        This API provides multiple read-only operations on the TED website data.
        The endpoint 'Notice Search API' can be used to search notices both TED schema notices and eForms notices.
        More information is available on the help pages of the TED website:
        <ul>
            <li><a href="https://ted.europa.eu">TED - Website</a></li>
            <li><a href="https://ted.europa.eu/en/search/expert-search">Expert Search</a></li>
            <li><a href="https://ted.europa.eu/en/contact">Contact</a></li>
            <li><a href="https://ted.europa.eu/en/legal-notice">Legal notice</a></li>
        </ul>

        The API is accessible to the general public and can be utilized by anyone in accordance with the <a href="#terms-of-usage">term of usage</a>.

        <h1 id="change-log">Change logs</h1>

        <table style="border: 1px solid;">
            <thead>
                <tr>
                    <th style="border: 1px solid;">Version</th>
                    <th style="border: 1px solid;">Date</th>
                    <th style="border: 1px solid;">Changes</th>
                </tr>
            </thead>
            <tr>
                <td style="border: 1px solid;">N/A</td>
                <td style="border: 1px solid;">N/A</td>
                <td style="border: 1px solid;">N/A</td>
            </tr>
        </table>


        <h1>Public API search modes</h1>

        This section describes the different search modes provided by the public search API.
        Each parameter of the search API is detailed in the OpenAPI documentation of the API.

        <h2>Pagination mode</h2>
        The pagination mode is the default mode of the public search API.
        This mode is stateless: the user can retrieve any result page, and not necessary in order. It also means that there is no mechanism to ensure consistency between two retrieved pages: if the user retrieves multiple pages and an OJS is released between two retrieved pages, then the user might miss some notices or have duplicated notices.
        Also, due to how Elasticsearch works internally, a limit on the number of retrievable notices for a given query has been put in place. This limit is described in the <i>Definition of limits</i> section.

        The user must provide the following parameters to the API to paginate results:
        <ul>
            <li>limit: the number of notices returned per page. For example, limit=10 means that 10 notices will be returned.
            </li>
            <li>page: the page number to retrieve. For example, page=1 means that the first result page will be retrieved.</li>
        </ul>

        <h2>Scroll mode</h2>
        The scroll mode allows user to retrieve all notices for a given query, without limitations defined in section <i>Definition of limits</i>.
        With this mode, the user calls the search API to retrieve the first result page and a token. This token can then be included in the next query sent to the search API to retrieve the next result page. The user knows all notices have been retrieved once there is no more notice returned.
        The Elasticsearch point in time feature is used to ensure a consistency between all returned pages, which means that the user cannot miss notices or have duplicated notices. An Elasticsearch point in time is a freeze of the Elasticsearch instance at a specific time. If notices are added or removed during the lifetime of a point in time, the notices registered in the point in time don’t change.
        The point in time has an expiration time. This expiration time is defined as the date of the next OJS release plus 24 hours. It means that the user has always at least 24 hours to retrieve all the notices for a given query.

        The user must provide the following parameters to the API to retrieve results in scroll mode:
        <ul>
            <li>paginationMode should be set to “ITERATION”.</li>
            <li>limit: the number of notices to return for the next page.</li>
            <li>iterationNextToken: the token returned by the previous call to the search API. If this is the first call (i.e.,
                to retrieve the first page), this parameter shouldn’t be provided.
            </li>
        </ul>

        <h1>Definition of limits</h1>
        Here is a definition of the different limits defined for the SEM (Search Engine Module) endpoints in the next sections:
        <ul>
            <li>Maximum number of retrievable notices: this corresponds to the number of notices that can be retrieved once the
                user has queried all pages. For example, if the user retrieves all notices for a given query with page size 250,
                and the limit of retrievable notices is 10k, it means the SEM will return no more notice after page 10k / 250 =
                40, even if the query matches more than 10k notices.
            </li>
            <li>Maximum number of notices per page: if this limit is X, then it means the user can retrieve X or less notices
                per page, but not more than X notices per page.
            </li>
            <li>Maximum number of fields per page: the number of fields per page is defined as the number of notices per page
                multiplied by the number of fields retrieved for each notice. For example, with a limit of 250, the user is
                allowed to retrieve 50 notices per page and 4 fields per notice (50 * 4 < 250). However, they are not allowed to
                retrieve 100 notices per page and 4 fields per notice (100 * 4 > 250).
            </li>
        </ul>

        <h2>Search using pagination mode of public API</h2>

        The pagination mode of the public search API has the following limits:
        <ul>
            <li>Maximum number of retrievable notices: 15k.</li>
            <li>Maximum number of notices per page: 250.</li>
            <li>Maximum number of fields per page: 10k.</li>
        </ul>
        In case a limit is reached, the search API will return an error to the user.

        <h2>Search using scroll mode of public API</h2>

        The scroll mode of the public search API has the following limits:
        <ul>
            <li>Maximum number of notices per page: 250.</li>
            <li>Maximum number of fields per page: 10k.</li>
        </ul>
        In case a limit is reached, the search API will return an error to the user.
        There is no limit on the number of retrievable notices.

        <h1>Versioning</h1>

        The versioning of the TED Public API is managed by including the major version in the URL (eg. v1). An upgrade of the major version will denote a breaking changes of the API whereas minor and maintenance will be transparent to the client. The <a href="#change-log">change logs</a> will contain the details of any modifications made to the API, serving as a means to notify clients about newly added features or bug fixes. The list of <i>fields</i> by their variable nature are excluded from the versioning, addition, removal or update of a fields will not change the versioning.


        <h1>Frequently Asked Questions</h1>

        <h3>How can I create, test or validate an expert query?</h3>
        <h3>The API returns an error regarding an invalid field, format or value, how can I debug?</h3>

        The <a href="https://ted.europa.eu/en/search/expert-search">TED Expert Search</a> page can be used for that purpose. It includes the capabilities to write a query,
        check the syntax, list all the fields and execute the query. The query once tailored can be reused in the query field parameter.


        <h1 id="terms-of-usage">Terms of Usage</h1>

        <li><a href="https://ted.europa.eu/en/legal-notice">Legal notice</a></li>





        </details>
