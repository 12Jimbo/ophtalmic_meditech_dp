          items:
            type: string
          minItems: 1
          uniqueItems: true
        page:
          type: integer
          format: int32
          default: 1
          description: "Result page number, used to paginate results"
          minimum: 1
        limit:
          type: integer
          format: int32
          default: 10
          description: |
            Maximum number of returned notices, used to paginate results.

            You can retrieve up to 250 notices per page, and 10000 fields per page (the number of fields per page corresponds to the size of the "fields" array multiplied by the value of "limit").
          minimum: 0
        scope:
          type: string
          default: ALL
          description: "Search scope (LATEST: only notices of the current OJ S release,\
            \ ACTIVE: only active notices, ALL: all notices)"
          enum:
          - LATEST
          - ACTIVE
          - ALL
        checkQuerySyntax:
          type: boolean
          default: false
          description: "To check the syntax of the query.  When the parameter is set\
            \ to  'true', the syntax of the query is checked, but the search query\
            \ is not executed."
        paginationMode:
          type: string
          default: PAGE_NUMBER
          description: |
            The PAGE_NUMBER mode allows you to retrieve up to 15000 notices for a given query, using pagination.
            To retrieve more notices, you can use the ITERATION mode. ITERATION mode does not have limitation on the number of retrievable notices, but you can't choose the page you want to retrieve. The first request will return an iterationNextToken that should be provided to the next call of the search endpoint in order to retrieve the next result page.
          enum:
          - PAGE_NUMBER
          - ITERATION
        onlyLatestVersions:
          type: boolean
          default: false
          description: Include only the latest versions
        iterationNextToken:
          type: string
          description: |
            Opaque token returned by the previous call to the search endpoint to retrieve the next result page.
            It shouldn't be provided in PAGE_NUMBER mode or if this is the first request in ITERATION mode.
      required:
      - fields
      - query
      title: PublicExpertSearchRequest
    ExpertSearchResponse:
      type: object
      description: Response body of the notice search endpoint
      properties:
        notices:
          type: array
          description: Found notices
          items:
            type: object
            $ref: "#/components/schemas/NoticeResponse"
            additionalProperties: {}
        totalNoticeCount:
          type: integer
          format: int64
          description: Total number of notices matching the search query
        iterationNextToken:
          type: string
          description: "Generated token use to store the position inside of the search.\
            \ Optional if PAGE_NUMBER pagination mode, mandatory if ITERATION mode"
        timedOut:
          type: boolean
          description: Indicate if the search request has timed out
    QueryLocation:
      type: object
      properties:
        beginColumn:
          type: integer
          format: int32
        beginLine:
          type: integer
          format: int32
        endColumn:
          type: integer
          format: int32
        endLine:
          type: integer
          format: int32
    QuerySyntaxErrorError:
      type: object
      description: Error details when expert query has a syntax error
      properties:
        type:
          type: string
          description: Code to identify the error type
          enum:
          - QUERY_SYNTAX_ERROR
        location:
          $ref: "#/components/schemas/QueryLocation"
          description: Error location in the query
    QueryInvalidFieldFormatDetails:
      type: object
      description: Error details when expert query contains a field with an invalid
        format (eg. invalid date)
      properties:
        type:
          type: string
          description: Code to identify the error type
          enum:
          - QUERY_INVALID_FIELD_FORMAT
        location:
          $ref: "#/components/schemas/QueryLocation"
          description: Error location in the query
        fieldName:
          type: string
          description: Invalid field name
        allowedPattern:
          type: string
          description: Allowed pattern for the values of the invalid field
    QueryUnknownFieldError:
      type: object
      description: Error details when expert query contains an unknown field
      properties:
        type:
          type: string
          description: Code to identify the error type
          enum:
          - QUERY_UNKNOWN_FIELD
        location:
          $ref: "#/components/schemas/QueryLocation"
          description: Error location in the query
        fieldName:
          type: string
          description: Unknown field name
    QueryUnsupportedFieldOperationError:
      type: object
      description: Error details when expert query uses an unsupported operation for
        a field
      properties:
        type:
          type: string
          description: Code to identify the error type
          enum:
          - QUERY_UNSUPPORTED_FIELD_OPERATION
        location:
          $ref: "#/components/schemas/QueryLocation"
          description: Error location in the query
        operation:
          type: string
          description: Unsupported operation
          enum:
          - TERM
          - EXACT_TERM
          - PHRASE
          - EXACT_PHRASE
          - WILDCARD
          - PREFIX
          - EXIST
          - COMPARISON
          - SORT
        fieldName:
          type: string
          description: Name of the field with the unsupported operation
    QueryUnsupportedFieldValueError:
      type: object
      description: Error details when expert query uses an unsupported value for a
        field
      properties:
        type:
          type: string
          description: Code to identify the error type
          enum:
          - QUERY_UNSUPPORTED_FIELD_VALUE
        location:
          $ref: "#/components/schemas/QueryLocation"
          description: Error location in the query
        fieldName:
          type: string
          description: Name of the field with the unsupported operation
        fieldValue:
          type: string
          description: Unsupported value
    UnsupportedValueError:
      type: object
      description: Error details when a parameter contains an unsupported value
      properties:
        type:
          type: string
          description: Code to identify the error type
          enum:
          - UNSUPPORTED_VALUE
        parameterName:
          type: string
          description: Name of the parameter with the unsupported value
        unsupportedValue:
          type: string
          description: Unsupported value
    UnsupportedValueException:
      type: object
      properties:
        cause:
          type: object
          properties:
            stackTrace:
              type: array
              items:
                type: object
                properties:
                  classLoaderName:
                    type: string
                  moduleName:
                    type: string
                  moduleVersion:
                    type: string
                  methodName:
                    type: string
                  fileName:
                    type: string
                  lineNumber:
                    type: integer
                    format: int32
                  className:
                    type: string
                  nativeMethod:
                    type: boolean
            message:
              type: string
            suppressed:
              type: array
              items:
                type: object
                properties:
                  stackTrace:
                    type: array
                    items:
                      type: object
                      properties:
                        classLoaderName:
                          type: string
                        moduleName:
                          type: string
                        moduleVersion:
                          type: string
                        methodName:
                          type: string
                        fileName:
                          type: string
                        lineNumber:
                          type: integer
                          format: int32
                        className:
                          type: string
                        nativeMethod:
                          type: boolean
                  message:
                    type: string
                  localizedMessage:
                    type: string
            localizedMessage:
              type: string
        stackTrace:
          type: array
          items:
            type: object
            properties:
              classLoaderName:
                type: string
              moduleName:
                type: string
              moduleVersion:
                type: string
              methodName:
                type: string
              fileName:
                type: string
              lineNumber:
                type: integer
                format: int32
              className:
                type: string
              nativeMethod:
                type: boolean
        error:
          $ref: "#/components/schemas/UnsupportedValueError"
        message:
          type: string
        suppressed:
          type: array
          items:
            type: object
            properties:
              stackTrace:
                type: array
                items:
                  type: object
                  properties:
                    classLoaderName:
                      type: string
                    moduleName:
                      type: string
                    moduleVersion:
                      type: string
                    methodName:
                      type: string
                    fileName:
                      type: string
                    lineNumber:
                      type: integer
                      format: int32
                    className:
                      type: string
                    nativeMethod:
                      type: boolean
              message:
                type: string
              localizedMessage:
                type: string
        localizedMessage:
          type: string
    ExpiredIterationTokenError:
      type: object
      description: Error when provided iteration token is expired
      properties:
        type:
          type: string
          description: Code to identify the error type
          enum:
          - EXPIRED_ITERATION_TOKEN
    InvalidIterationTokenError:
      type: object
      description: Error when provided iteration token is invalid
      properties:
        type:
          type: string
          description: Code to identify the error type
          enum:
          - INVALID_ITERATION_TOKEN
    Notice:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The notice identifier (without the version).
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        versionId:
          type: string
          description: The version identifier.
          example: "01"
        procedureId:
          type: string
          format: uuid
          description: The procedure identifier.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa5
        status:
          $ref: "#/components/schemas/NoticeStatus"
        updatedAt:
          type: string
          format: date-time
          description: "Indicates the timestamp of the latest notice update by user\
            \ or the system, e.g. when publication was stopped."
          example: 2022-01-01T13:15:55.89Z
        submittedAt:
          type: string
          format: date-time
          description: Captures the Notice Dispatch Date (BT-05) as entered by the
            eSender.
          example: 2022-01-01T13:15:55.89Z
        createdAt:
          type: string
          format: date-time
          description: Captures the timepstamp the instance was created in eNotices2.
          example: 2022-01-01T13:15:55.89Z
        transmittedAt:
          type: string
          format: date-time
          description: "Matches the BT-803 (Notice Dispatch Date eSender) timestamp\
            \ from the XML, when available. When empty, the value is \"null\"."
          example: 2022-01-01T13:15:55.89Z
        publicationId:
          type: string
          description: The notice publication identifier.
          example: 8164123-2024
        publicationDate:
          type: string
          format: date
          description: The notice publication date.
        noticeType:
          type: string
          description: The notice subtype.
          example: '"2"'
        legalBasis:
          type: string
          description: The notice legal basis code.
          example: 32014L0025
        languages:
          type: array
          description: The official EU languages in which the whole notice is available.
          example:
          - ENG
          - DEU
          items:
            type: string
            description: Identifies the language code used for the text.
            example: ENG
        noticeAuthor:
          type: string
          description: "The email used to identify the person responsible for the\
            \ notice, i.e. the Contracting Authority."
          example: minimal@email.eu
        expectedPublicationDate:
          type: string
          format: date
          description: The notice expected publication date.
    NoticeStatus:
      type: string
      description: |
        The notice status.
      enum:
      - DRAFT
      - SUBMITTED
      - STOPPED
      - PUBLISHED
      - PUBLISHING
      - DELETED
      - NOT_PUBLISHED
      - ARCHIVED
      - VALIDATION_FAILED
      - IMPORTED_PUBLISHED
      example: STOPPED
    ExceptionBody:
      type: object
      description: The information related to the Exception that occurred.
      properties:
        code:
          type: string
          description: The exception code.
          example: notice.NOTICE_NOT_FOUND
        message:
          type: string
          description: The exception message.
          example: No notice found
    Metadata:
      type: object
      description: "The metadata that is used to identify the original author of the\
        \ notice, i.e. the Contracting Authority."
      properties:
        noticeAuthorEmail:
          type: string
          description: "The email is used to identify the person responsible for the\
            \ notice, i.e. the Contracting Authority."
          example: john@doe.com
        noticeAuthorLang:
          type: string
          description: "The EU official language in which the Contracting Authority\
            \ wishes to be notified by the Publications Office. Enum: [bg, cs, da,\
            \ de, el, en, es, et, fi, fr, ga, hr, hu, it, lt, lv, mt, nl, pl, pt,\
            \ ro, sk, sl, sv]"
          example: en
      required:
      - noticeAuthorEmail
      - noticeAuthorLang
    NoticeSubmitRequest:
      type: object
      description: The metadata and notice used during the submission of the notice.
      properties:
        metadata:
          $ref: "#/components/schemas/Metadata"
          description: The metadata that is used to identify the original author of
            the notice.
        notice:
          type: string
          format: binary
          description: The notice XML content.
      required:
      - metadata
      - notice
    NoticeSubmitResponse:
      type: object
      description: The details of the CVS report following XML submission.
      properties:
        validationReportUrl:
          type: string
          description: The URL to use to retrieve the CVS validation report
        success:
          type: boolean
          description: "The status of the submission. True if success, otherwise false."
    NoticeSearchRequest:
      type: object
      description: The information used in a notice search.
      properties:
        id:
          type: string
          format: uuid
          description: The notice identifier (without the version).
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        versionId:
          type: string
          description: The version identifier.
          example: "01"
        createdAfter:
          type: string
          format: date-time
          description: The minimum date/time value used to find notices created after
            this point.
          example: 2022-01-01T13:15:55.890Z
        createdBefore:
          type: string
          format: date-time
          description: The maximum date/time value used to find notices created before
            this point.
          example: 2022-12-01T23:00:00.000Z
        submittedAfter:
          type: string
          format: date-time
          description: The minimum date/time value used to find notices submitted
            after this point.
          example: 2022-01-01T13:15:55.890Z
        submittedBefore:
          type: string
          format: date-time
          description: The maximum date/time value used to find notices submitted
            before this point.
          example: 2022-12-01T23:00:00.000Z
        publishedAfter:
          type: string
          format: date-time
          description: The minimum date/time value used to find notices published
            after this point.
          example: 2022-01-01T13:15:55.890Z
        publishedBefore:
          type: string
          format: date-time
          description: The maximum date/time value used to find notices published
            before this point.
          example: 2022-12-01T23:00:00.000Z
        transmittedAfter:
          type: string
          format: date-time
          description: The minimum date/time value used to find notices transmitted
            after this point.
          example: 2022-01-01T13:15:55.890Z
        transmittedBefore:
          type: string
          format: date-time
          description: The maximum date/time value used to find notices transmitted
            before this point.
          example: 2022-12-01T23:00:00.000Z
        statuses:
          type: array
          description: |
            Possible statuses to include in the search:
             * SUBMITTED - The notice is successfully received, validated, and sent to OP (received by internal system TED Monitor).
             * STOPPED - Publication of the notice was stopped by the buyer/eSender before publication, and the request was accepted. End status.
             * PUBLISHING - Publication process in progress, i.e., the notice has been added to the daily export for TED.
             * PUBLISHED - The notice is published online on TED. End status.
             * NOT_PUBLISHED - The notice was received but not published on TED. End status.
             * VALIDATION_FAILED - The notice was submitted but failed CVS validation upon submission. End status.
             * DRAFT - The notice is being drafted.
             * DELETED - The notice has been deleted by front-end user.
             * ARCHIVED - The notice has been archived by front-end user.
             * IMPORTED_PUBLISHED - The notice has been imported from TED.

             Note: "DRAFT", "DELETED" and "ARCHIVED" reflect actions taken exclusively via the web interface.
             API users should manage notices through API operations without using the web interface to maintain system integrity.
          items:
            type: string
            enum:
            - DRAFT
            - SUBMITTED
            - STOPPED
            - PUBLISHED
            - PUBLISHING
            - DELETED
            - NOT_PUBLISHED
            - ARCHIVED
            - VALIDATION_FAILED
            - IMPORTED_PUBLISHED
        noticeAuthor:
          type: string
          description: The notice author.
          example: minimal@email.eu
    NoticeSearchResponse:
      type: object
      description: The information returned after a notice search.
      properties:
        totalSize:
          type: integer
          format: int64
          description: The total size of entities found.
          example: 99
        content:
          type: array
          description: The content of entities found.
          items:
            $ref: "#/components/schemas/Notice"
            description: The content of entities found.
    NoticeValidationRequest:
      type: object
      description: Request parameters for validation
      properties:
        notice:
          type: string
          format: byte
          description: Payload in base64 for the XML document
          example: aGVsbG8=
        language:
          type: string
          default: en
          description: "Language to generate the SVRL report. Enum: [bg, cs, da, de,\
            \ el, en, es, et, fi, fr, ga, hu, it, lt, lv, mt, nl, pl, pt, ro, sk,\
            \ sl, sv, hr]"
          example: en
        validationMode:
          type: string
          default: STATIC
          description: "Specify the validation mode that will be applied, selecting\
            \ the corresponding set of rules from the eForms SDK that will be applied."
          enum:
          - DYNAMIC
          - STATIC
          example: STATIC
        eFormsSdkVersion:
          type: string
          description: Specify the eForms SDK version to use for validating the notice.
            This parameter should be omitted unless you want to override the version
            indicated in the cbc:CustomizationID element in the notice.
          example: eforms-sdk-1.0
      required:
      - notice
